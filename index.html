<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kylaash's Chatbot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="chat-app">
  <header class="header">
    🤖 Kylaash's Chatbot
  </header>

  <section id="chatbox">
    <div id="messages"></div>
    <div class="typing-indicator" id="typing" style="display: none;">
      <span></span><span></span><span></span>
    </div>
  </section>

  <footer class="input-area">
    <input type="text" id="userInput" placeholder="Ask anything..." aria-label="Chat input" />
    <button onclick="sendMessage()" aria-label="Send message">➤</button>
  </footer>
</main>

<script src="chatbot-data.js"></script>
<script src="script.js"></script>

</body>
</html>
