<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kylaash's Chatbot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="chat-app">

  <div class="header">
    🤖 Kylaash's Chatbot
  </div>

  <div id="chatbox">
    <div id="messages"></div>
  </div>

  <div class="typing" id="typing">Bot is typing...</div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="Ask anything..." />
    <button onclick="sendMessage()">➤</button>
  </div>

</div>

<script src="chatbot-data.js"></script>
<script src="script.js"></script>

</body>
</html>
